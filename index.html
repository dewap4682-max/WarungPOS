.notice,.notice.warning,.notice.success{background:#eefaf1;border-color:#b9e4c6;color:#000}
.notice svg{color:#15803d}
.logo-preview{background:#eefaf1;border-color:#9fd8ae;color:#000}
.logo-upload p{color:#000}
.role-card{background:#fff;border-color:#b9e4c6}
.role-card h3,.role-card p{color:#000}
.role-card>svg{color:#15803d}
.modal{background:#fff}
.modal-head h2,.modal-head p{color:#000}
.modal-footer{background:#f4fbf6;border-top-color:#b9e4c6}
.receipt-info h3,.receipt-info p{color:#000}
.receipt-preview-bg{background:#e9f9ee}
.success-hero h3,.success-hero p,.success-hero strong{color:#000}
.success-mark{background:#bbf7d0;color:#000}
.success-change{background:#eefaf1;border-color:#b9e4c6;color:#000}
.success-change strong{color:#000}
.toast{background:#86efac;color:#000;border-color:rgba(0,90,35,.3)}
.toast.error{background:#fca5a5;color:#000}
.toast.success svg,.toast.error svg{color:#000}
.auth-screen{background:#eefaf1}
.auth-story{background:linear-gradient(160deg,#86efac,#4ade80);color:#000}
.auth-story .eyebrow,.auth-story p,.auth-story .copyright{color:#000}
.auth-story h1,.auth-story h1 span{color:#000}
.story-features div{color:#000}
.story-features svg{color:#14532d}
.auth-form h2,.auth-form>p{color:#000}
.auth-form .auth-icon{background:#bbf7d0;color:#000}
.auth-demo-note{background:#fef9c3;border-color:#d9c26a;color:#000}
.auth-foot{color:#000}
.help-list,.help-list li,.help-list strong{color:#000}
.kbd{background:#eefaf1;border-color:#b9e4c6;color:#000}

.bar-track{background:#dcf2e3}
.bar-fill{background:#22c55e}

.cash-summary>div{background:#eefaf1;color:#000}
.cash-summary strong{color:#000}
.empty-state,.empty-state h3,.empty-state p{color:#000}

.boot-mark{background:#22c55e;color:#000}

::selection{background:#bbf7d0;color:#000}

/* ===== PENGEMBANG & GELEMBUNG WHATSAPP ===== */
.dev-panel{display:flex;align-items:center;gap:22px;margin-top:20px;background:#f2fbf5}
.dev-info{flex:1;min-width:0}
.dev-credit{font-size:14px;margin-bottom:8px}
.dev-credit strong{font-weight:800}
.dev-text{font-size:12px;line-height:1.75;margin-bottom:8px}
.dev-hidden{font-size:10.5px;font-weight:600}
.wa-bubble{position:relative;flex-shrink:0;width:64px;height:64px;border-radius:50%;background:#25d366;color:#fff!important;display:grid;place-items:center;box-shadow:0 8px 22px rgba(18,140,60,.4);border:3px solid #fff}
.wa-bubble svg{color:#fff}
.wa-bubble:hover{background:#1fb857;transform:scale(1.06)}
.wa-bubble .wa-dot{position:absolute;top:2px;right:2px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid #25d366}

/* ===== PPN & UKURAN HURUF ===== */
.tax-control{margin:6px 0 10px;padding:9px 10px;background:#eefaf1;border:1px solid #b9e4c6;border-radius:8px}
.tax-toggle{display:flex;align-items:center;gap:7px;font-weight:700;cursor:pointer}
.tax-toggle input{width:16px;height:16px;accent-color:#16a34a}
.tax-rate-wrap{display:flex;align-items:center;gap:5px;font-weight:700}
.tax-rate-wrap input{width:64px;padding:5px 7px;text-align:right;border:1px solid #9fd8ae;border-radius:6px;background:#fff;font-weight:700}
.tax-off{font-weight:600}
.appearance-panel{display:flex;align-items:center;gap:22px;margin-top:20px;background:#f2fbf5}
.font-preview{flex-shrink:0;width:72px;height:72px;border-radius:50%;background:#bbf7d0;border:2px solid #9fd8ae;display:grid;place-items:center;font-size:26px;font-weight:800}
body.teks-tebal{font-weight:600}
body.teks-tebal p,body.teks-tebal span,body.teks-tebal td,body.teks-tebal li,body.teks-tebal label,body.teks-tebal .btn,body.teks-tebal .nav-btn,body.teks-tebal .category,body.teks-tebal input,body.teks-tebal select,body.teks-tebal textarea,body.teks-tebal .p-name,body.teks-tebal .cart-title strong{font-weight:700}
body.teks-tebal small,body.teks-tebal .sub,body.teks-tebal .p-unit,body.teks-tebal .cart-unit{font-weight:600}

/* Layout khusus ponsel: tanpa lebar desktop minimum dan kontrol tetap bisa dijangkau. */
@media(max-width:800px){
  :root{--sidebar:54px;--pay:100%}
  .shell{min-width:0;grid-template-columns:54px minmax(0,1fr);overflow:hidden}
  .main{min-width:0;overflow:hidden}
  .topbar{padding:0 10px;gap:6px}
  .workspace{padding:12px 10px;overflow:auto}
  .workspace.pos-space{min-height:0;overflow:auto}
  .pos-layout{height:auto;display:flex;flex-direction:column;gap:12px}
  .catalog{min-height:520px}
  .payment{min-height:560px;overflow:visible}
  .page-title{align-items:flex-start;flex-direction:column;gap:10px}
  .page-title .title-actions{display:flex;flex-wrap:wrap;width:100%;gap:6px}
  .page-title .title-actions>.btn{white-space:normal;font-size:11px;padding:8px 9px;min-height:34px}
  .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stat-card{min-width:0;padding:12px}
  .stat-card strong{font-size:20px}
  .filters{display:flex;flex-wrap:wrap;gap:7px}
  .filters>.searchbar{flex:1 1 100%;min-width:0}
  .filters>.btn,.filters>label.btn{min-height:34px;padding:7px 9px;font-size:10px}
  .table-wrap{max-width:100%;overflow:auto}
  .modal-overlay{padding:7px}
  .modal{max-height:calc(100dvh - 14px)}
  .modal-body{padding:12px}
  .modal-footer{padding:10px 12px;flex-wrap:wrap}
}
</style>

      if(!Number.isFinite(taxRate)||taxRate<0||taxRate>100||Math.abs(taxRate*100-Math.round(taxRate*100))>0.001)throw new Error('Tarif PPN tidak valid (0-100%, maks 2 angka desimal).');

        existingAfter=d.sales.find(x=>x.requestId===requestId);if(existingAfter)return;
        const map=new Map(),items=[];let subtotal=0,cost=0;
        for(const line of p.items){
          const product=d.products.find(x=>x.id===line.productId);
          if(!product||!product.active)throw new Error('Produk tidak tersedia. Muat ulang keranjang.');
          const qty=quantity(line.qty),old=map.get(product.id)||0;map.set(product.id,old+qty);
          if(old+qty>100000||old+qty>product.stock)throw new Error(`Stok ${product.name} tidak cukup (tersisa ${product.stock}).`);
          const prev=items.find(x=>x.productId===product.id);
          if(prev){prev.qty=Math.round((prev.qty+qty)*1000)/1000;prev.lineTotal=Math.round(prev.price*prev.qty);}
          else items.push({productId:product.id,name:product.name,sku:product.sku,unit:product.unit,qty,price:product.price,cost:product.cost,lineTotal:Math.round(product.price*qty)});

        for(const item of items){subtotal+=item.lineTotal;cost+=Math.round(item.cost*item.qty);}
        if(discount>subtotal)throw new Error('Diskon melebihi subtotal.');
        if(discount>0&&u.role==='kasir')throw new Error('Diskon memerlukan izin Admin atau Super User.');

        const total=subtotal-discount+pajak;
        if(total>MAX_MONEY)throw new Error('Total transaksi melebihi Rp 1 miliar. Pisahkan transaksi.');
        const paid=method==='Tunai'?integer(p.paid,'Uang diterima',total,MAX_MONEY):total;
        const at=now(),number=`${dateKey().replaceAll('-','')}-${String(++d.counters.sale).padStart(5,'0')}`;
        id=uid();const shift=this.currentShift(d,u);
        const sale={id,requestId,number,at,userId:u.id,userName:u.name,shiftId:shift?.id||'',items,subtotal,cost,discount,taxRate,tax:pajak,total,paid,change:paid-total,method,reference:text(p.reference,'Referensi pembayaran',80,false),status:'completed',printCount:0,storeSnapshot:clone(d.store)};
        for(const [pid,qty] of map){const product=d.products.find(x=>x.id===pid);product.stock=Math.round((product.stock-qty)*1000)/1000;}
        d.sales.unshift(sale);this.audit(d,u,'Transaksi',`${number} / Rp ${total}`);
      });return existingAfter||this.db.sales.find(x=>x.id===id);
    }
    sale_void(p,u) {
      const reason=text(p.reason,'Alasan pembatalan',240);
      this.store.commit(d=>{
        const s=d.sales.find(x=>x.id===p.id);if(!s)throw new Error('Nota tidak ditemukan.');if(s.status==='void')throw new Error('Nota sudah dibatalkan.');
        const shift=d.shifts.find(x=>x.id===s.shiftId);if(shift&&shift.status==='closed')throw new Error('Kas transaksi sudah ditutup. Gunakan penyesuaian kas dan catatan audit, bukan pembatalan.');
        const quantities=new Map();s.items.forEach(i=>quantities.set(i.productId,(quantities.get(i.productId)||0)+i.qty));
        for(const [pid,qty] of quantities){const prod=d.products.find(x=>x.id===pid);if(prod)prod.stock=Math.round((prod.stock+qty)*1000)/1000;}
        s.status='void';s.voidReason=reason;s.voidAt=now();s.voidBy=u.name;this.audit(d,u,'Batalkan transaksi',`${s.number}; ${reason}`);
      });return {ok:true};
    }
    demo_clear(p,u) {
      this.store.commit(d=>{
        const used=new Set(d.sales.flatMap(s=>s.items.map(i=>i.productId)));let n=0;
        d.products=d.products.filter(x=>{if(!x.isDemo)return true;if(used.has(x.id)){x.active=false;return true;}n++;return false;});
        this.audit(d,u,'Bersihkan data contoh',`${n} produk dihapus; produk pernah terpakai diarsipkan.`);
      });return {ok:true};
    }
    report(p={}) {
      const from=p.from||dateKey(),to=p.to||dateKey();
      if(!/^\d{4}-\d{2}-\d{2}$/.test(from)||!/^\d{4}-\d{2}-\d{2}$/.test(to)||from>to)throw new Error('Rentang tanggal tidak valid.');
      const sales=this.db.sales.filter(s=>s.status==='completed'&&dateKey(s.at)>=from&&dateKey(s.at)<=to);
      const total=sales.reduce((a,s)=>a+s.total,0),cost=sales.reduce((a,s)=>a+(s.cost||0),0);
      const byMethod={},byProduct={};
      for(const s of sales){byMethod[s.method]=(byMethod[s.method]||0)+s.total;for(const i of s.items){const x=byProduct[i.productId]||(byProduct[i.productId]={name:i.name,qty:0,total:0});x.qty+=i.qty;x.total+=i.lineTotal;}}
      const tax=sales.reduce((a,s)=>a+(s.tax||0),0);
      return {from,to,count:sales.length,total,tax,cost,profit:total-tax-cost,byMethod,byProduct,subtotal:sales.reduce((a,s)=>a+s.subtotal,0),discount:sales.reduce((a,s)=>a+s.discount,0),sales};
    }
  }
  return {VERSION,ROLES,uid,now,dateKey,quantity,integer,text,clone,checksum,envelope,emptyDB,seedProducts,validateDB,parseBackup,MemoryAdapter,Store,Service,MAX_MONEY};
});

  const rp=n=>'Rp '+Math.round(Number(n)||0).toLocaleString('id-ID');
  const qty=n=>Number(n).toLocaleString('id-ID',{maximumFractionDigits:3});

  /* ---- Jenis kertas ----------------------------------------------------
     thermal    : kertas gulung termal 58 / 80 mm, tinggi mengikuti isi struk
     a4         : kertas HVS A4 210 x 297 mm, isi struk dicetak di tengah
                  (untuk printer biasa / printer yang tidak support roll)

    thermal:   {label:'Kertas struk termal',sheet:false,pageW:58,   pageH:null, content:58, font:11,padX:3,padTop:3, padBot:6},
    a4:        {label:'Kertas A4',          sheet:true, pageW:210,  pageH:297,  content:80, font:12,padX:0,padTop:10,padBot:10},
    continuous:{label:'Continuous Form',    sheet:true, pageW:215.9,pageH:279.4,content:190,font:13,padX:0,padTop:12,padBot:12}

    if(sale.discount)push('Diskon','- '+rp(sale.discount));
    if(sale.tax)push('PPN '+Number(sale.taxRate||0).toLocaleString('id-ID',{maximumFractionDigits:2})+'%',rp(sale.tax));

      @page{size:${L.pageW}mm ${L.pageH?L.pageH+'mm':'auto'};margin:0}

      .line{display:flex;justify-content:space-between;gap:2mm;align-items:flex-start}.line span:last-child{text-align:right;white-space:nowrap}
      .rule{border-top:1px dashed #000;margin:2.5mm 0}.item{margin:2mm 0}
      .total{font-weight:bold;font-size:${L.font+2}px;border-top:1px solid #000;padding-top:2mm;margin-top:2mm}
      .footer{white-space:pre-wrap;margin-top:3mm;font-size:${L.font}px}.muted{font-size:${L.font-2}px}
      .void{border:2px solid #000;padding:2mm;font-weight:bold;font-size:${L.font+3}px;margin:3mm 0}.reference{font-size:${L.font-1}px}
      @media print{.item,.line,.total{break-inside:avoid}}

  }
  function wrap(s,n){const words=String(s).split(/\s+/),lines=[];let line='';for(let word of words){while(word.length>n){if(line){lines.push(line);line='';}lines.push(word.slice(0,n));word=word.slice(n);}if((line+' '+word).trim().length>n){if(line)lines.push(line);line=word;}else line=(line+' '+word).trim();}if(line)lines.push(line);return lines;}

    const n=L.cols||(o.width===80?48:32),center=s=>wrap(s,n).map(x=>x.padStart(Math.floor((n+x.length)/2))).join('\n');

function scan(code){
 const clean=String(code).trim();if(!clean)return;
 const exact=S.products.find(p=>p.active&&[p.barcode,p.sku].some(s=>s&&s.toLowerCase()===clean.toLowerCase()));
 if(exact){addProduct(exact.id);notify(`${exact.name} masuk keranjang.`);query='';if($('#product-search'))$('#product-search').value='';renderProductGrid();return;}
 const found=S.products.filter(p=>p.active&&p.name.toLowerCase().includes(clean.toLowerCase()));if(found.length===1){addProduct(found[0].id);return;}
 if(isAdmin()){notify('Barcode belum terdaftar. Tambahkan produk baru.');productForm(null,clean);}else notify('Barcode tidak ditemukan. Hubungi Admin untuk mendaftarkan produk.',true);
}

async function opCameraStart(){if(!navigator.mediaDevices?.getUserMedia){notify('Kamera tidak tersedia. Buka PWA melalui HTTPS/localhost dan izinkan akses kamera.',true);return}if(!('BarcodeDetector'in window)&&!window.ZXingBrowser?.BrowserMultiFormatReader){notify('Pembaca barcode tidak tersedia di browser ini.',true);return}try{const box=$('#op-camera-box'),video=$('#op-camera-video'),status=$('#op-camera-status');box.classList.remove('hidden');opCameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=opCameraStream;await video.play();if('BarcodeDetector'in window){const supported=await BarcodeDetector.getSupportedFormats();const wanted=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code','codabar'].filter(f=>supported.includes(f));const detector=new BarcodeDetector({formats:wanted});const scan=async()=>{if(!opCameraStream)return;try{if(!opCameraBusy&&video.readyState>=2){opCameraBusy=true;const found=await detector.detect(video);if(found.length)opCameraFound(found[0].rawValue,status);opCameraBusy=false}}catch{opCameraBusy=false;status.textContent='Belum terbaca — dekatkan dan stabilkan barcode.'}opCameraTimer=setTimeout(scan,250)};scan()}else{status.textContent='Pemindai aktif (mode kompatibel Android/iOS).';const reader=new ZXingBrowser.BrowserMultiFormatReader();opZxingControls=await reader.decodeFromVideoElement(video,(result,err)=>{if(result)opCameraFound(result.getText(),status)});}}catch(e){opCameraStop();notify('Tidak dapat membuka kamera: '+(e.message||e)+' Pastikan akses kamera aktif dan halaman memakai HTTPS.',true)}}

async function opImportCSV(e){const file=e.target.files?.[0];if(!file)return;const text=await file.text();const lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean);const parseLine=line=>{let out=[],v='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'&&q&&line[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){out.push(v);v=''}else v+=c}out.push(v);return out};const head=parseLine(lines.shift()).map(x=>x.trim().toLowerCase());const idx=(...names)=>head.findIndex(x=>names.includes(x));let n=0;for(const line of lines){const c=parseLine(line),get=(...names)=>c[idx(...names)]||'';const name=get('nama','name').trim();if(!name)continue;const data={name,barcode:get('barcode'),sku:get('sku','kode'),category:get('kategori','category')||S.categories[0],unit:get('satuan','unit')||'pcs',cost:Number(get('modal','cost'))||0,price:Number(get('harga','price'))||0,counted:Number(get('stok_fisik','stok','stock'))||0};const existing=S.products.find(p=>p.active&&((data.barcode&&p.barcode===data.barcode)||(data.sku&&p.sku===data.sku)));const row=opRows.find(r=>existing?r.id===existing.id:(r.isNew&&((data.barcode&&r.barcode===data.barcode)||r.name===name)));if(row)Object.assign(row,{counted:String(data.counted)});else if(existing)opRows.push({...existing,id:existing.id,old:existing.stock,counted:String(data.counted),isNew:false});else opAddNew(data);n++}renderOpRows();notify(`${n} baris CSV dimuat.`);e.target.value='';}

ntuan resmi dari pengembang aplikasi ini.</p></div>${I('shield',21)}</div><p class="dev-credit">Aplikasi ini dikembangkan oleh <strong>BolangCorp</strong></p><p class="dev-text">Mengalami <strong>bug atau kesalahan teknis</strong>? Tekan gelembung WhatsApp di samping untuk langsung chat dengan pengembang. Ceritakan masalahnya, bila bisa sertakan foto layar (screenshot).</p><p class="dev-hidden">Nomor WhatsApp disembunyikan demi privasi — cukup tekan gelembungnya, nomor tidak ditampilkan.</p></div><button type="button" class="wa-bubble" data-action="support-wa" title="Laporkan bug via WhatsApp" aria-label="Hubungi pengembang BolangCorp via WhatsApp">${I('whatsapp',30)}<span class="wa-dot"></span></button></section><div class="settings-actions"><button type="button" class="btn" data-action="navigate" data-screen="kasir">Kembali ke kasir</button><button class="btn primary" type="submit">${I('check',16)} Simpan pengaturan</button></div></form>`;

function renderHelp(){return `${title('Panduan singkat','Semua yang perlu diketahui untuk mulai berjualan.')}<div class="settings-grid"><div class="panel"><div class="panel-heading"><h2>Mulai transaksi</h2>${I('grid',22)}</div><ol class="help-list"><li><strong>Scan atau pilih produk.</strong> Arahkan kursor ke pencarian dengan <span class="kbd">F2</span>. Scanner USB/Bluetooth harus menggunakan mode keyboard/HID dan akhiran Enter atau Tab. Barcode yang sama menambah jumlah item.</li><li><strong>Periksa keranjang di kanan.</strong> Gunakan + / − atau ketik jumlah. Untuk barang timbangan, masukkan jumlah desimal (kg), bukan mengambil berat otomatis dari timbangan.</li><li><strong>Terima pembayaran.</strong> Pilih Tunai, lalu masukkan uang diterima. Tombol <span class="kbd">F9</span> menyimpan transaksi jika nominal cukup. QRIS, transfer, dan kartu hanya pencatatan manual setelah Anda memastikan pembayaran diterima.</li><li><strong>Cetak nota.</strong> Sesudah bayar, pilih Cetak nota atau Simpan PDF. Nota lama tersedia di Riwayat. Jika cetak gagal, transaksi tidak hilang.</li><li><strong>Foto gelembung.</strong> Admin membuka Produk & stok → Edit → Pilih foto. Foto akan tampil bulat di kasir serta kecil di keranjang.</li></ol></div><div class="panel"><div class="panel-heading"><h2>Perangkat & keamanan data</h2>${I('shield',22)}</div><ol class="help-list"><li><strong>Printer struk &amp; kertas.</strong> Pasang driver Windows dari produsen, lalu di Pengaturan pilih nama printer dan <strong>jenis kertas</strong>: kertas struk termal 58/80 mm, kertas A4, atau Continuous Form. Ukuran halaman selalu menyesuaikan kertas dan tinggi struk mengikuti isi. Bila tepi kanan terpotong pada merek tertentu, turunkan <strong>skala isi struk</strong>. Mode Driver memakai dialog/silent print; RAW memakai perintah ESC/POS dan hanya untuk kertas gulung termal.</li><li><strong>Barcode.</strong> Mendukung scanner keyboard/HID yang mengirim teks barcode, termasuk EAN/UPC/Code 128/QR beroutput function openModal(titleText,body,footer='',options={}){
 if(!modalKind)modalReturnFocus=document.activeElement;
 modalKind=options.kind||'generic';
 modalRoot.innerHTML=`<div class="modal-overlay"><section class="modal ${options.wide?'wide':''} ${options.narrow?'narrow':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><div><h2 id="modal-title">${esc(titleText)}</h2>${options.subtitle?`<p>${esc(options.subtitle)}</p>`:''}</div><button class="icon-btn" data-action="close-modal" title="Tutup">${I('x',18)}</button></header>${options.form?`<form id="${options.form}" ${options.novalidate?'novalidate':''}>`:''}<div class="modal-body">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}${options.form?'</form>':''}</section></div>`;
 setTimeout(()=>{$('.modal input:not([type=hidden]),.modal select,.modal .modal-footer button,.modal .modal-head button')?.focus();},70);
}
function closeModal(){opCameraStop();modalRoot.innerHTML='';modalKind='';if(modalReturnFocus?.isConnected)modalReturnFocus.focus();modalReturnFocus=null;}

async function receiptModal(sale,success=false){
 const html=await api('receipt.html',{id:sale.id,width:S.printer.width});
 openModal(success?'Pembayaran berhasil':'Detail nota',`<div class="receipt-layout"><div class="receipt-preview-bg"><div class="receipt-paper" style="width:${R.previewBox(S.printer.paper,S.printer.width,S.printer.scale).width}px"><iframe id="receipt-frame" title="Pratinjau struk" sandbox="allow-same-origin"></iframe></div></div><div class="receipt-info">${success?`<div class="success-mark">${I('check',30)}</div>`:badge(sale.status==='void'?'Dibatalkan':'Transaksi selesai',sale.status==='void'?'red':'green')}<h3>${rp(sale.total)}</h3><p>${esc(sale.number)}<br>${formatDate(sale.at)} · ${formatTime(sale.at)}<br>${esc(sale.userName)} · ${esc(sale.method)}</p>${success&&sale.method==='Tunai'?`<div class="success-change"><span>Kembalian</span><strong>${rp(sale.change)}</strong></div>`:''}${sale.status==='void'?`<div class="notice warning mt">${esc(sale.voidReason)}</div>`:''}<button class="btn primary" data-action="print-receipt" data-id="${sale.id}">${I('printer',16)} Cetak nota</button><button class="btn" data-action="pdf-receipt" data-id="${sale.id}">${I('download',16)} ${meta.desktop?'Simpan PDF':'Unduh nota HTML'}</button>${isOwner()&&sale.status!=='void'?`<button class="btn danger" data-action="void-receipt" data-id="${sale.id}">${I('x',15)} Batalkan transaksi</button>`:''}<p style="font-size:10px;margin-top:16px">${S.printer.name?'Printer: '+esc(S.printer.name):'Printer belum dipilih. Buka Pengaturan untuk menghubungkan printer.'}</p></div></div>`,`<button class="btn primary" data-action="close-modal">${success?'Transaksi baru':'Tutup'}</button>`,{wide:true,kind:'receipt'});
 $('#receipt-frame').srcdoc=html;
}
function simpleForm(kind,titleText,body,label='Simpan'){openModal(titleText,body,cancelButton+`<button class="btn primary" type="submit">${label}</button>`,{form:kind+'-form',kind,narrow:true});}
function openShift(){simpleForm('open-shift','Buka shift kas',`<div class="field"><label>Modal awal uang tunai (Rp)</label><input name="opening" type="number" min="0" max="1000000000" step="1" value="0" required></div><div class="field"><label>Catatan <span class="optional">(opsional)</span></label><input name="note" maxlength="240" placeholder="Contoh: Shift pagi"></div>`,'Buka shift');}
function closeShift(){const sh=currentShift();if(!sh)return;simpleForm('close-shift','Tutup shift kas',`<div class="notice">${I('wallet',19)}<span>Hitung seluruh uang fisik di laci. Aplikasi akan mencocokkannya dengan modal, penjualan tunai, serta kas masuk/keluar yang tercatat.</span></div><div class="field"><label>Uang fisik hasil perhitungan (Rp)</label><input name="counted" type="number" min="0" max="1000000000" step="1" required></div><div class="field"><label>Catatan <span class="optional">(opsional)</span></label><input name="note" maxlength="240" placeholder="Catatan selisih kas"></div>`,'Tutup shift');}
function cashMove(){simpleForm('cash-move','Catat kas masuk / keluar',`<div class="field"><label>Jenis pencatatan</label><select name="type"><option value="out">Kas keluar</option><option value="in">Kas masuk</option></select></div><div class="field"><label>Nominal (Rp)</label><input name="amount" type="number" min="1" max="1000000000" step="1" required></div><div class="field"><label>Keterangan / alasan</label><textarea name="note" maxlength="240" required placeholder="Contoh: Belanja kantong plastik"></textarea></div>`);
}
function accountModal(){const u=S.currentUser;openModal('Akun saya',`<div class="product-form-top"><div class="avatar" style="width:62px;height:62px;font-size:22px">${esc(u.name.slice(0,2).toUpperCase())}</div><div><h3>${esc(u.name)}</h3><p>${esc(u.username)} · ${roleNames[u.role]}</p></div></div><div class="notice">${I('shield',19)}<span>Gunakan kata sandi unik. Jangan meninggalkan komputer dalam keadaan terbuka saat warung ramai.</span></div>`,`<button class="btn" data-action="change-password">Ubah sandi</button><button class="btn primary" data-action="logout">Kunci aplikasi</button>`,{narrow:true});}
async function saveSettings(test=false){
 const f=$('#settings-form');if(!f||!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));
 const p={store:{name:d.name,address:d.address,phone:d.phone,footer:d.footer,logo:d.logo},printer:{name:d.printerName,paper:d.paper,width:Number(d.width),scale:Number(d.scale),mode:d.mode,silent:!!d.silent,autoPrint:!!d.autoPrint,cut:!!d.cut,credit:!!d.credit}};if(isOwner())p.appearance={fontScale:Number(d.fontScale),boldText:!!d.boldText};
 await action('settings.save',p);render();notify('Pengaturan tersimpan.');
 if(test){const r=await api('print.test',{config:p.printer});notify(r.message);}
}
async function refreshPrinters(){const list=await api('printers');printerList=list;const select=$('#printer-select');if(!select)return;const previous=select.value;select.innerHTML='<option value="">— Pilih printer —</option>'+list.map(p=>`<option value="${esc(p.name)}">${esc(p.displayName)}${p.isDefault?' (default)':''}</option>`).join('');select.value=previous;notify(`${list.length} printer ditemukan.`);}
async function doLogout(){try{await api('api','logout');}catch{}S=null;closeModal();meta={...meta,...await api('api','status')};renderAuth(false);}
function navigate(next){if(['produk','laporan','pengaturan'].includes(next)&&!isAdmin())return;if(next==='pengguna'&&!isOwner())return;screen=next;render();}
async function handleClick(event){
 const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,id=el.dataset.id;
 try{
 switch(a){
 case 'navigate':navigate(el.dataset.screen);break;
 case 'category':category=el.dataset.category;$$('.category').forEach(b=>b.classList.toggle('active',b.dataset.category===category));renderProductGrid();break;
 case 'view':view=el.dataset.view;$$('.view-toggle button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));renderProductGrid();break;
 case 'add-product':addProduct(id);break;
 case 'qty-plus':addProduct(id);break;
 case 'qty-minus':{const l=cart.find(x=>x.id===id);if(l){if(l.qty<=1){cart=cart.filter(x=>x.id!==id);saveCart();renderProductGrid();renderPayment();}else setQty(id,l.qty-1);}break;}
 case 'remove-item':cart=cart.filter(x=>x.id!==id);checkoutRequest=null;saveCart();renderProductGrid();renderPayment();break;
 case 'clear-cart':if(cart.length)confirmModal('Kosongkan keranjang?','Produk yang belum dibayar akan dihapus dari keranjang. Stok tidak berubah.','confirm-clear-cart','Kosongkan');break;
 case 'confirm-clear-cart':clearCart();closeModal();renderProductGrid();renderPayment();break;
 case 'focus-scan':$('#product-search')?.focus();break;
 case 'method':method=el.dataset.method;saveCart();renderPayment();break;
 case 'quick-cash':cash=Number(el.dataset.value).toLocaleString('id-ID');saveCart();renderPayment();break;
 case 'exact-cash':cash=cartTotal().toLocaleString('id-ID');saveCart();renderPayment();break;
 case 'discount':simpleForm('discount','Atur diskon transaksi',`<div class="notice">${I('shield',18)}<span>Diskon hanya untuk Admin dan Super User. Diberikan pada total transaksi, bukan per item.</span></div><div class="field"><label>Diskon nominal (Rp)</label><input name="discount" type="number" min="0" max="${cartSubtotal()}" step="1" value="${discount}" required></div>`,'Terapkan diskon');break;
 case 'checkout':await checkout();break;
 case 'close-modal':closeModal();break;
 case 'new-product':productForm();break;
 case 'stocktake':stocktakeModal();break;
 case 'op-add-new':opAddNew();break;
 case 'op-remove':opRows.splice(Number(el.dataset.index),1);renderOpRows();break;
 case 'op-export-template':opExportTemplate();break;
 case 'op-save':await opSave();break;
 case 'op-scan-add':opScanAdd();break;
 case 'op-camera':await opCameraStart();break;
 case 'op-camera-stop':opCameraStop();break;
 case 'edit-product':productForm(id);break;
 case 'archive-product':{const p=product(id);confirmModal(p.active?'Arsipkan produk?':'Aktifkan produk?',p.active?`${p.name} tidak tampil di kasir. Riwayat transaksi tetap tersimpan.`:`${p.name} akan dijual kembali.`,p.active?'confirm-archive':'confirm-archive',p.active?'Arsipkan':'Aktifkan',id);break;}
 case 'confirm-archive':await action('product.archive',{id});closeModal();render();notify('Status produk diperbarui.');break;
 case 'pick-product-image':case 'pick-logo':{const data=await api('image.pick',{logo:a==='pick-logo'});if(data){const isLogo=a==='pick-logo',f=isLogo?$('#settings-form'):$('#product-form');f.elements.logo?f.elements.logo.value=data:f.elements.image.value=data;$(isLogo?'#store-logo-preview':'#product-image-preview').src=data;}break;}
 case 'remove-product-image':$('#product-form').elements.image.value='';$('#product-image-preview').src=image({});break;
 case 'remove-logo':$('#settings-form').elements.logo.value='';$('#store-logo-preview').src=WPOSAssets.logo;break;
 case 'adjust-stock':{const p=product(id);simpleForm('stock','Penyesuaian stok',`<div class="notice">${I('box',19)}<span>${esc(p.name)} · Stok tercatat: <strong>${nf(p.stock)} ${esc(p.unit)}</strong></span></div><input type="hidden" name="id" value="${id}"><div class="field"><label>Perubahan stok (+ tambah / − kurang)</label><input name="delta" type="number" min="-100000" max="100000" step="0.001" placeholder="Contoh: 10 atau -2" required></div><div class="field"><label>Alasan penyesuaian</label><textarea name="note" maxlength="240" required placeholder="Contoh: Barang masuk / rusak / hasil stok opname"></textarea></div>`);break;}
 case 'categories':categoryModal();break;
 case 'add-category':{const name=$('#new-category').value;await action('category.save',{name});render();categoryModal();notify('Kategori ditambahkan.');break;}
 case 'rename-category':simpleForm('category','Ubah kategori',`<input type="hidden" name="old" value="${esc(el.dataset.name)}"><div class="field"><label>Nama kategori</label><input name="name" value="${esc(el.dataset.name)}" maxlength="40" required></div>`);break;
 case 'delete-category':await action('category.delete',{name:el.dataset.name});render();categoryModal();notify('Kategori dihapus.');break;
 case 'export-products':notify((await api('export.csv',{type:'products'})).message||'Dibatalkan.');break;
 case 'export-report':notify((await api('export.csv',{type:'sales',from:filters.reportFrom,to:filters.reportTo})).message||'Dibatalkan.');break;
 case 'receipt':{const sale=S.sales.find(s=>s.id===id);if(sale)await receiptModal(sale);break;}
 case 'print-receipt':el.disabled=true;try{notify((await api('print.sale',{id})).message);}finally{if(el.isConnected)el.disabled=false;}break;
 case 'pdf-receipt':notify((await api('receipt.pdf',{id})).message);break;
 case 'void-receipt':simpleForm('void','Batalkan transaksi',`<div class="notice warning">${I('warning',19)}<span>Pembatalan hanya untuk Super User. Stok dikembalikan dan nota tetap tersimpan dengan status dibatalkan. Pengembalian uang harus dilakukan manual.</span></div><input type="hidden" name="id" value="${id}"><div class="field"><label>Alasan pembatalan</label><textarea name="reason" required maxlength="240" placeholder="Contoh: Salah input, uang sudah dikembalikan"></textarea></div>`,'Batalkan transaksi');break;
 case 'history-today':filters.historyDate=C.dateKey();renderScreen();break;
 case 'history-all':filters.historyDate='';renderScreen();break;
 case 'refresh':S=await action('state');render();notify('Data disegarkan.');break;
 case 'apply-report':filters.reportFrom=$('#report-from').value;filters.reportTo=$('#report-to').value;await loadReport();break;
 case 'report-month':filters.reportFrom=C.dateKey().slice(0,7)+'-01';filters.reportTo=C.dateKey();renderScreen();break;
 case 'open-shift':openShift();break;
 case 'close-shift':closeShift();break;
 case 'cash-move':cashMove();break;
 case 'refresh-printers':await refreshPrinters();break;
 case 'test-print':await saveSettings(true);break;
 case 'backup':notify((await api('backup.export')).message||'Dibatalkan.');break;
 case 'restore':confirmModal('Pulihkan seluruh data?','Data saat ini akan diganti dengan isi backup. Backup pengaman dibuat lebih dahulu. Semua akun harus login kembali memakai sandi dari file backup.','confirm-restore','Pilih file backup');break;
 case 'confirm-restore':{closeModal();const r=await api('backup.restore');if(!r.cancelled){S=null;meta={...meta,...await api('api','status')};renderAuth(false);notify(r.message);}break;}
 case 'data-folder':{const r=await api('data.folder');if(r.message)notify(r.message);break;}
 case 'clear-demo':confirmModal('Bersihkan produk contoh?','Produk contoh yang belum pernah terjual dihapus. Produk yang pernah masuk transaksi hanya diarsipkan agar riwayat tetap utuh.','confirm-clear-demo','Bersihkan');break;
 case 'confirm-clear-demo':await action('demo.clear');closeModal();render();notify('Produk contoh dibersihkan.');break;
 case 'new-user':userForm();break;
 case 'edit-user':userForm(id);break;
 case 'account':accountModal();break;
 case 'change-password':simpleForm('password','Ubah kata sandi',`<div class="field"><label>Kata sandi lama</label><input type="password" name="oldPassword" maxlength="128" required autocomplete="current-password"></div><div class="field"><label>Kata sandi baru</label><input type="password" name="password" minlength="8" maxlength="128" required autocomplete="new-password"></div><div class="field"><label>Ulangi kata sandi baru</label><input type="password" name="confirm" minlength="8" maxlength="128" required autocomplete="new-password"></div>`,'Ubah sandi');break;
 case 'support-wa':{const pesan=encodeURIComponent('Halo BolangCorp, saya mengalami bug / kesalahan teknis pada aplikasi Warung POS ${meta.version}. Mohon dibantu.\n\nCeritakan masalahnya: ');const url='https://wa.me/6281392399300?text='+pesan;if(meta.desktop){await api('support.open',{url});notify('Membuka WhatsApp… Ceritakan bug yang Anda alami.');}else{window.open(url,'_blank','noopener');notify('Membuka WhatsApp di tab baru…');}break;}
 case 'logout':closeModal();saveCart();await doLogout();break;
 }
 }catch(e){notify(e.message||String(e),true);}
}
async function handleSubmit(event){
 const f=event.target;const fid=typeof f.getAttribute==='function'?f.getAttribute('id'):'';if(!fid)return;event.preventDefault();if(f.dataset.submitting)return;
 const d=Object.fromEntries(new FormData(f));f.dataset.submitting='1';const submit=$('button[type=submit]',f);if(submit)submit.disabled=true;
 try{
 switch(fid){
 case 'setup-form':case 'login-form':{const setup=fid==='setup-form';if(setup)d.samples=!!d.samples;const r=await api('api',setup?'setup':'login',d);S=r.state;meta.initialized=true;loadCart();screen='kasir';render();notify(setup?'Warung siap digunakan. Selamat berjualan!':'Selamat datang, '+S.currentUser.name+'.');break;}
 case 'product-form':{const id=d.id;await action('product.save',{...d,id:id||undefined,cost:Number(d.cost),price:Number(d.price),stock:Number(d.stock),minStock:Number(d.minStock),active:!!d.active});closeModal();render();notify('Produk dan foto berhasil disimpan.');break;}
 case 'settings-form':await saveSettings();break;
 case 'user-form':await action('user.save',{...d,id:d.id||undefined,active:!!d.active});closeModal();render();notify('Akun disimpan.');break;
 case 'stock-form':await action('stock.adjust',{...d,delta:Number(d.delta)});closeModal();render();notify('Stok disesuaikan dan dicatat dalam audit.');break;
 case 'category-form':await action('category.save',d);closeModal();render();notify('Kategori diperbarui.');break;
 case 'discount-form':{const n=Number(d.discount);if(!isAdmin()||!Number.isSafeInteger(n)||n<0||n>cartSubtotal())throw new Error('Diskon tidak valid.');discount=n;checkoutRequest=null;saveCart();closeModal();renderPayment();break;}
 case 'open-shift-form':await action('shift.open',{opening:Number(d.opening),note:d.note});closeModal();render();notify('Shift dibuka.');break;
 case 'close-shift-form':{const result=await action('shift.close',{counted:Number(d.counted),note:d.note});closeModal();render();openModal('Shift ditutup',`<div class="success-hero"><div class="success-mark">${I('check',30)}</div><h3>Rekonsiliasi kas selesai</h3><p>Simpan uang fisik sesuai hasil perhitungan Anda.</p></div><div class="success-change"><span>Uang fisik</span><strong>${rp(Number(d.counted))}</strong></div><div class="summary-row mt"><span>Kas diharapkan</span><span>${rp(result.expected)}</span></div><div class="summary-row"><span>Selisih</span><span>${rp(Number(d.counted)-result.expected)}</span></div>`,'<button class="btn primary" data-action="close-modal">Selesai</button>',{narrow:true});break;}
 case 'cash-move-form':await action('shift.move',{...d,amount:Number(d.amount)});closeModal();render();notify('Kas berhasil dicatat.');break;
 case 'void-form':await action('sale.void',d);closeModal();render();notify('Transaksi dibatalkan. Stok dikembalikan.');break;
 case 'password-form':if(d.password!==d.confirm)throw new Error('Konfirmasi kata sandi baru tidak sama.');await action('user.password',d);closeModal();notify('Kata sandi berhasil diubah.');break;
 }
 }catch(e){if(fid==='login-form'||fid==='setup-form'){const box=$('#auth-error');box.textContent=e.message;box.classList.remove('hidden');}else notify(e.message,true);}
 finally{delete f.dataset.submitting;if(submit?.isConnected)submit.disabled=false;}
}
function handleInput(event){const t=event.target;if(t.dataset.opCount!==undefined){const i=Number(t.dataset.opCount);opRows[i].counted=t.value;const d=t.closest('tr')?.querySelector('[data-op-delta]');if(d){const diff=(Number(t.value)||0)-(Number(opRows[i].old)||0);d.textContent=opRows[i].isNew?'Baru':(diff>0?'+':'')+nf(diff);}return;}if(t.dataset.opName!==undefined){opRows[Number(t.dataset.opName)].name=t.value;return;}if(t.dataset.opPrice!==undefined){opRows[Number(t.dataset.opPrice)].price=t.value;return;}if(t.dataset.opCost!==undefined){opRows[Number(t.dataset.opCost)].cost=t.value;return;}switch(t.id){case 'product-search':query=t.value;renderProductGrid();break;case 'cash-input':cash=t.value;updatePaymentValues();break;case 'payment-reference':paymentReference=t.value;saveCart();break;case 'tax-rate':taxRate=t.value;updatePaymentValues();saveCart();break;case 'manage-search':filters.product=t.value;renderProductTable();break;case 'history-search':filters.history=t.value;renderHistoryTable();break;}}
const PAPER_HINT={
  thermal:'Lebar dikunci sesuai kertas (58/80 mm), tinggi mengikuti isi struk.',
  a4:'Untuk printer biasa / printer yang tidak mendukung gulungan. Isi struk dicetak selebar 80 mm di tengah kertas A4.',
  continuous:'Untuk kertas berlubang dot matrix. Isi struk selebar 190 mm dan ganti halaman di setiap perforasi.'
};
function syncPaperFields(){
  const select=$('#paper-select');if(!select)return;
  const paper=select.value==='a4'||select.value==='continuous'?select.value:'thermal';
  const wf=$('#width-field');if(wf)wf.style.display=paper==='thermal'?'':'none';
  const hint=$('#paper-hint-text');if(hint)hint.textContent=PAPER_HINT[paper];
}
function handleChange(event){const t=event.target;if(t.id==='import-products-file'){importProductsCSV(t);return;}if(t.id==='paper-select'){syncPaperFields();return;}if(t.id==='tax-enabled'){taxEnabled=t.checked;checkoutRequest=null;saveCart();renderPayment();return;}if(t.id==='tax-rate'){taxRate=t.value;try{localStorage.setItem('warung-pos-ppn',taxRate);}catch{}checkoutRequest=null;saveCart();renderPayment();return;}if(t.dataset.qty){setQty(t.dataset.qty,t.value);return;}switch(t.id){case 'manage-category':filters.productCategory=t.value;renderProductTable();break;case 'show-archived':filters.showArchived=t.checked;renderProductTable();break;case 'history-date':filters.historyDate=t.value;renderHistoryTable();break;}}
function handleKey(event){
 if(event.key==='Escape'&&modalKind){event.preventDefault();closeModal();return;}
 if(event.key==='Tab'&&modalKind){const focusable=$$('button:not(:disabled),input:not([type=hidden]),select,textarea,[tabindex="0"]',$('.modal')).filter(e=>e.offsetParent!==null);const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}
 if(!S)return;
 if(event.key==='F2'){event.preventDefault();if(screen!=='kasir')navigate('kasir');$('#product-search')?.focus();return;}
 if(event.key==='F9'){event.preventDefault();if(screen==='kasir'&&!modalKind)checkout();return;}
 if(modalKind)return;
 if(event.target.id==='product-search'&&(event.key==='Enter'||event.key==='Tab')){
   const value=event.target.value.trim();const looksScan=value.length>=3&&(scannerBuffer.length>=3||/^(DEMO-|\d{4,})/i.test(value));
   if(value&&(event.key==='Enter'||looksScan)){event.preventDefault();scan(value);scannerBuffer='';return;}
 }
 const editable=event.target.matches('input,textarea,select,[contenteditable=true]');
 if(!editable&&screen==='kasir'){
   const now=performance.now();if(now-scannerLast>90)scannerBuffer='';scannerLast=now;
   if(event.key==='Enter'||event.key==='Tab'){if(scannerBuffer.length>=3){event.preventDefault();scan(scannerBuffer);}scannerBuffer='';}
   else if(event.key.length===1&&!event.ctrlKey&&!event.metaKey&&!event.altKey){scannerBuffer+=event.key;if(scannerBuffer.length>64)scannerBuffer=scannerBuffer.slice(-64);}
 }
}
async function boot(){
 try{
 if(!window.posBridge){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='browser-bridge.js';script.onload=resolve;script.onerror=reject;document.head.appendChild(script);});}
 meta=await api('meta');
 if(!meta.desktop&&window.posBridge.initialState){S=window.posBridge.initialState;meta.initialized=true;}
 else meta={...meta,...await api('api','status')};
 if(S)loadCart();render();document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.addEventListener('input',handleInput);document.addEventListener('change',handleChange);document.addEventListener('keydown',handleKey);
 }catch(e){root.innerHTML=`<div class="boot"><div class="boot-mark">!</div><h1>Aplikasi belum dapat dibuka</h1><p>${esc(e.message)}</p><p>Data tidak dihapus. Coba buka ulang aplikasi.</p></div>`;}
}
boot();
})();
